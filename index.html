<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Hexagonal Snake Demo</title>
		<link rel="stylesheet" href="css/style.css?v=0.0.4"/>
		<!-- The version is repeated in ?v= so browsers fetch new files after an update, and at the bottom of the side window -->
		<script src="scripts/hex.js?v=0.0.4" defer></script>
		<script src="scripts/fruits.js?v=0.0.4" defer></script>
		<script src="scripts/board.js?v=0.0.4" defer></script>
		<script src="scripts/pathfinding.js?v=0.0.4" defer></script>
		<script src="scripts/snake.js?v=0.0.4" defer></script>
		<script src="scripts/render.js?v=0.0.4" defer></script>
		<script src="scripts/main.js?v=0.0.4" defer></script>
	</head>

	<body>
		
		<noscript>
			You need to enable JavaScript to show this page.
		</noscript>

		<div class="center_container" id="header">
			
			<h1>Hexagonal Snake</h1>
			
		</div>

		<div class="center_container" id="body_container">

			<div id="window_container">

				<div id="window">
					<canvas id="board" width="600" height="600"></canvas>
				</div>

				<div id="side_window">

					<div class="label">
						Score :
					</div>
					<div class="display" id="score_display">
						0
					</div>

					<div class="label">
						Speed :
					</div>					
					<div class="display">
						<input
							type="range"
							min="0"
							max="10"
							step="1"
							value="5"
							data-orientation="horizontal"
							class="rangeslider"
							id="speed_slider"
						/>
					</div>

					<div class="label">
						Size :
						<span class="value" id="size_display">30</span>
					</div>
					<div class="display">
						<input
							type="range"
							min="10"
							max="60"
							step="1"
							value="30"
							data-orientation="horizontal"
							class="rangeslider"
							id="size_slider"
						/>
						<div class="hint" id="size_hint">
							Restart to resize
						</div>
					</div>

					<div class="label">
						Actions :
					</div>		
					<div class="display">
						<div class="button" id="starve_button">
							<p>
								Starve
							</p>
						</div>

						<div class="button" id="gorge_button">
							<p>
								Gorge
							</p>
						</div>
					</div>	

					<div class="label">
						Menu :
					</div>		
					<div class="display">
						<div class="button" id="pause_button">
							<p>
								Pause
							</p>
						</div>

						<div class="button" id="restart_button">
							<p>
								Restart
							</p>
						</div>
					</div>

					<div class="text">
						Help the snake get bigger by dropping fruits. Don't overfeed him or he might bite its own tail...
					</div>

					<div class="version">
						v0.0.4
					</div>

				</div>

			</div>
			
		</div>

	</body>
</html>
